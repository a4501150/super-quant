[project]
name = "super-quant"
version = "0.1.0"
description = "Config-driven quantization and serving pipeline for hybrid language models"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25.0",
    "datasets>=3.0.0",
    "transformers>=5.16.0",
    "torch==2.14.1",
    "tqdm>=4.66.0",
    "accelerate>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]
quantize = [
    "llmcompressor @ git+https://github.com/vllm-project/llm-compressor.git@ab1ba3effcafc15746cd6d6ca24cba3f7bd7a582",
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }