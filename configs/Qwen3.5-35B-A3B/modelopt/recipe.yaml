# NVIDIA ModelOpt QuantizeConfig for Qwen3.5/3.6 hybrid MoE (Qwen3.8 family policy).
# Self-contained: numerics inlined from modelopt_recipes/configs/numerics, no imports.
# Entries apply in order; later entries override earlier ones.
#
# Quantization map (matches the llmcompressor-line policy on this model family):
#   mlp.experts.*                                  NVFP4 W4A4 (E2M1, block 16,
#                                                  dynamic block scales, W4A4)
#   self_attn.{q,k,v,o}_proj                       FP8 W8A8 (E4M3 w-channel, a-token dyn)
#   linear_attn.{in_proj_qkv,in_proj_z,out_proj}   FP8 W8A8 (same)
#   mlp.shared_expert.*                            FP8 W8A8 (same)
#   lm_head                                        BF16 (vendor FP8 configs exclude it)
#   KV cache k/v BMM                               FP8, data-calibrated (static scales)
#   everything else -> BF16 by the base disable below: PLE n-gram embedding,
#   token/vision embeddings, lm_head, router/gates, shared_expert_gate, linear_attn
#   conv1d / in_proj_a / in_proj_b, norms, vision tower, MTP heads
#   (keep-list matches modules_to_not_convert in the official
#   Qwen3.5-35B-A3B-FP8 and Qwen3.8-Flash-Next-FP8 configs).
#
# modelopt-schema: modelopt.torch.quantization.config.QuantizeConfig
# awq_full = activation-aware per-input-channel scaling grid (alpha_step grid)
# + weight-clip search, over every enabled quantizer. Multiple calibration
# forwards per grid point: this algorithm is the slow stage, not the export.
# gptq runs second in the chain: Hessian weight compensation per layer,
# block_size must be a multiple of the nvfp4 group (16). PR #2401 patch makes
# the GPTQ Hessians see AWQ-smoothed input coordinates; apply it on-box.
# FP8 input quantizers are DYNAMIC (axis null, type dynamic): amax is recomputed
# on every forward, no calibrated activation scale ships, and no calibrator
# tensor exists to go shape-unsound. A static axis:0 amax (one entry per batch
# element) crashes modelopt's awq_clip with "amax shape changed!" once cached
# activations are replayed per layer — static per-batch-element activation
# scales are incompatible with awq_full on this wheel (0.46). vLLM recomputes
# FP8 activation scales per-token at runtime, same as the community AWQ+GPTQ
# reference (TelperionAI Qwen3.8-27B-NVFP4-AWQ-GPTQ: dynamic FP8 activations).
algorithm:
  - method: awq_full
    alpha_step: 0.1
  - method: gptq
    block_size: 128
    perc_damp: 0.01

quant_cfg:
  # ---- base: nothing quantizes unless explicitly enabled below ----
  - quantizer_name: '*weight_quantizer'
    enable: false
  - quantizer_name: '*input_quantizer'
    enable: false

  # ---- FP8 attention + shared expert (lm_head stays BF16, see header) ----
  # Weights: static FP8, per output channel (matches the community
  # TelperionAI reference; export emits strategy=channel, see convert_hf_config).
  # Activations: dynamic (amax per forward, per-tensor during calibration
  # fake-quant); nothing activation-side is baked into the checkpoint.
  # self_attn contains exactly {q,k,v,o}_proj Linears, one wildcard suffices.
  - quantizer_name: '*self_attn*weight_quantizer'
    cfg: {num_bits: e4m3, axis: 0}
  - quantizer_name: '*self_attn*input_quantizer'
    cfg: {num_bits: e4m3, axis: null, type: dynamic}
  - quantizer_name: '*linear_attn.in_proj_qkv*weight_quantizer'
    cfg: {num_bits: e4m3, axis: 0}
  - quantizer_name: '*linear_attn.in_proj_qkv*input_quantizer'
    cfg: {num_bits: e4m3, axis: null, type: dynamic}
  - quantizer_name: '*linear_attn.in_proj_z*weight_quantizer'
    cfg: {num_bits: e4m3, axis: 0}
  - quantizer_name: '*linear_attn.in_proj_z*input_quantizer'
    cfg: {num_bits: e4m3, axis: null, type: dynamic}
  - quantizer_name: '*linear_attn.out_proj*weight_quantizer'
    cfg: {num_bits: e4m3, axis: 0}
  - quantizer_name: '*linear_attn.out_proj*input_quantizer'
    cfg: {num_bits: e4m3, axis: null, type: dynamic}
  - quantizer_name: '*mlp.shared_expert*weight_quantizer'
    cfg: {num_bits: e4m3, axis: 0}
  - quantizer_name: '*mlp.shared_expert*input_quantizer'
    cfg: {num_bits: e4m3, axis: null, type: dynamic}
  # shared_expert_gate is a gate: keep BF16 despite the shared_expert wildcard.
  - quantizer_name: '*mlp.shared_expert_gate*quantizer'
    enable: false
  # ---- NVFP4 routed experts ----
  # '*.experts.*' never matches 'mlp.shared_expert.', so no collision with FP8 above.
  # Stock dynamic-block NVFP4 weights (NVIDIA nvfp4_awq_full territory, plus
  # the GPTQ leg). four_over_six (arXiv 2512.02010) is NOT combinable here on
  # modelopt 0.46: its static spelling crashes AWQ's fake-quant forward
  # (ScaledE4M3Function is E4M3-only) and its 4/6 flag is ignored on the
  # dynamic path; NVIDIA pairs 4/6 with MSE-only chains. See preset
  # configs/ptq/presets/model/nvfp4_four_over_six for the 4o6 variant.
  - quantizer_name: '*.experts.*weight_quantizer'
    cfg:
      num_bits: e2m1
      block_sizes:
        -1: 16
        type: dynamic
        scale_bits: e4m3
  # Activations stay stock dynamic NVFP4: calibrated global scale at export,
  # per-16-block FP8 scales computed at runtime (the vLLM/TensorRT-LLM W4A4
  # contract; static activation block scales are not servable).
  - quantizer_name: '*.experts.*input_quantizer'
    cfg:
      num_bits: e2m1
      block_sizes:
        -1: 16
        type: dynamic
        scale_bits: e4m3

  # ---- static FP8 KV cache (data-calibrated, not _cast) ----
  - quantizer_name: '*[kv]_bmm_quantizer'
    cfg: {num_bits: e4m3, axis: null}

  # ---- keep-alive belt: GDN internals that bare wildcards could catch ----
  # (in_proj_qkv/_z and out_proj above are deliberately NOT disabled.)
  - quantizer_name: '*linear_attn.conv1d*'
    enable: false
  - quantizer_name: '*linear_attn.in_proj_a*'
    enable: false
  - quantizer_name: '*linear_attn.in_proj_b*'
    enable: false
  - quantizer_name: '*mlp.gate*'
    enable: false
  - quantizer_name: '*router*'
    enable: false
  - quantizer_name: '*visual*'
    enable: false
  - quantizer_name: '*embed_tokens*'
    enable: false
